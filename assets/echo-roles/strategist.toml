[role]
description = "Planning role for customer workflows. Recovers relevant ECHO context, frames the decision or plan, and identifies concrete next steps."
sandbox = "read-only"
skills = ["using-echo-mcp"]

[role.requires]
mcp_servers = ["echo"]
capabilities = ["fs.read", "git.read", "mcp.echo.read"]

[role.output]
format = "markdown"
required_fields = ["decision", "next_steps"]
