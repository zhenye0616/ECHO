[role]
description = "Repository implementation role for customer workflows. Reads ECHO context when useful, edits the workspace, and reports the concrete changes made."
sandbox = "workspace-write"
skills = ["using-echo-mcp"]

[role.requires]
mcp_servers = ["echo"]
capabilities = ["fs.read", "fs.write", "git.read", "git.write", "mcp.echo.read"]

[role.output]
format = "markdown"
required_fields = ["summary", "files_changed"]
