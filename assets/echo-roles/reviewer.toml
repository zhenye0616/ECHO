[role]
description = "Read-only change review role for customer workflows. Reviews the current repository diff, uses ECHO context when useful, and reports actionable findings."
sandbox = "read-only"
skills = ["using-echo-mcp"]

[role.requires]
mcp_servers = ["echo"]
capabilities = ["fs.read", "git.read", "mcp.echo.read"]

[role.output]
format = "yaml-header + markdown"
required_fields = ["verdict", "reviewer", "findings"]
