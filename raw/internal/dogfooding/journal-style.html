<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --label: #7a3e9d;
    --accent: #0a66c2;
    --code-bg: #eef1f4;
    --border: #d8dde2;
    --card-bg: #ffffff;
  }
  html {
    line-height: 1.55;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  body {
    max-width: 56em;
    margin: 0 auto;
    padding: 2em 3em 4em;
  }
  @media (max-width: 700px) {
    body { padding: 1em; font-size: 14px; }
  }
  h1.title {
    font-size: 1.8em;
    border-bottom: 2px solid var(--border);
    padding-bottom: 0.4em;
    margin-top: 0.5em;
  }
  h1 { font-size: 1.7em; }
  h2 {
    font-size: 1.35em;
    margin-top: 2.4em;
    padding-top: 0.6em;
    border-top: 1px solid var(--border);
  }
  h3 {
    font-size: 1.05em;
    margin-top: 2em;
    padding: 0.55em 0.9em;
    background: var(--card-bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  h4 {
    font-size: 0.98em;
    color: var(--muted);
    margin-top: 1.6em;
    font-weight: 600;
  }
  h5, h6 { font-size: 0.95em; color: var(--muted); }
  p { margin: 0.8em 0; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.86em;
    background: var(--code-bg);
    padding: 0.1em 0.4em;
    border-radius: 3px;
  }
  pre {
    background: var(--code-bg);
    padding: 0.8em 1em;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 0.85em;
    line-height: 1.45;
    border: 1px solid var(--border);
  }
  pre code { background: transparent; padding: 0; font-size: inherit; }
  ul, ol { padding-left: 1.5em; margin: 0.7em 0; }
  li { margin: 0.3em 0; }
  li > ul, li > ol { margin: 0.3em 0; }
  /* Field labels: bulleted lines that start with "**Trigger:**", "**Sources:**", etc.
     Pandoc renders these as <li><strong>Label:</strong> content</li>. */
  li > strong:first-child {
    color: var(--label);
    font-variant: small-caps;
    letter-spacing: 0.03em;
    font-weight: 600;
  }
  /* But in headings/paragraphs we want strong to read normal */
  h1 strong, h2 strong, h3 strong, h4 strong, p > strong {
    color: inherit;
    font-variant: normal;
    letter-spacing: normal;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:visited { color: var(--accent); }
  blockquote {
    border-left: 3px solid var(--border);
    padding: 0.2em 1em;
    color: var(--muted);
    margin: 1em 0;
    background: var(--card-bg);
  }
  table {
    border-collapse: collapse;
    margin: 1em 0;
    font-size: 0.92em;
    width: 100%;
  }
  th, td {
    padding: 0.5em 0.8em;
    border: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  th { background: var(--code-bg); font-weight: 600; }
  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2.8em 0;
  }
  /* TOC */
  nav#TOC {
    font-size: 0.88em;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1em 1.5em;
    margin: 1.5em 0 2.5em;
  }
  nav#TOC > ul { padding-left: 1.2em; margin: 0.4em 0; }
  nav#TOC ul ul { padding-left: 1.2em; font-size: 0.96em; }
  nav#TOC li { margin: 0.15em 0; }
  /* Subtle anchor for date-stamped entry headers */
  h3, h4 { scroll-margin-top: 1em; }
  /* Print */
  @media print {
    body { background: white; padding: 0; max-width: none; font-size: 11pt; }
    h3 { box-shadow: none; background: transparent; }
    nav#TOC { page-break-after: always; }
  }
</style>
