[package]
name = "echo_decisions_overlay"
version = "0.1.0"
description = "ECHO decisions desktop overlay"
authors = ["ECHO"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "echo-decisions-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-opener = "2.5.0"

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow"] }
