name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backlog/**'
      - 'raw/**'
      - 'docs/**'
      - 'wiki/**'
  pull_request:
    paths-ignore:
      - 'backlog/**'
      - 'raw/**'
      - 'docs/**'
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally excluded from the unit-test (quality) gate:
        # the product unit suite is not yet Windows-portable (path separators,
        # CRLF, tmp-path assumptions — ~120 failures, all dev-side). Tracked as
        # the "Windows unit-test portability" epic in backlog/_followups.md. The
        # Windows ship-contract IS gated below via the onboarding job (packaged
        # install + selftest), which passes.
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build CLI
        run: npm run build:cli
      - name: Unit tests
        run: npm run test:product

  onboarding:
    name: onboarding · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Preconditions
        shell: bash
        run: |
          node -e "if(+process.versions.node.split('.')[0]<22)process.exit(1);console.log('node',process.version)"
          node -p "({platform:process.platform,arch:process.arch})"
          git --version
      - run: npm ci
      - name: Pack artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packed
          pack_output="$(npm pack --pack-destination packed --silent)"
          tarball="$(printf '%s\n' "$pack_output" | tail -n 1)"
          printf 'tarball=%s\n' "packed/${tarball}" >> "$GITHUB_OUTPUT"
      - name: Install packed echoctl
        shell: bash
        run: npm install -g "./${{ steps.pack.outputs.tarball }}"
      - name: Onboarding self-test
        run: echoctl selftest --json
